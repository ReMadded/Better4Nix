[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "better4nix"
version = "0.3.0"
description = "Plugin-driven Nix transpiler"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
better4nix = "better4nix.cli:main"

[tool.setuptools.packages.find]
include = ["better4nix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]